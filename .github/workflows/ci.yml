name: CI
on:
  push:
    paths: ["components/**", "ci/**", "tests/**", "esphome/**", "*.yaml", ".github/workflows/**"]
  pull_request:
    paths: ["components/**", "ci/**", "tests/**", "esphome/**", "*.yaml", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ci/requirements.txt
      - run: python tests/config_test.py
  firmware:
    strategy:
      fail-fast: false
      matrix:
        esphome: ["2026.3.0"]
        profile:
          - ci/esp32.yaml
          - ci/esp32_manual.yaml
          - ci/esp8266.yaml
          - ci/esp8266_manual.yaml
          - ci/tof_overdoor.yaml
          - peopleCounter32Home.yaml
          - peopleCounter32HomeDual.yaml
          - peopleCounter32HomeTriple.yaml
          - peopleCounter32FourSensorOverdoor.yaml
        include:
          - esphome: "2026.8.1"
            profile: peopleCounter32FourSensorOverdoor.yaml
          - esphome: "2026.8.1"
            profile: ci/esp32.yaml
          - esphome: "2026.8.1"
            profile: peopleCounter32SixSensorBringup.yaml
    name: Build ${{ matrix.profile }} (${{ matrix.esphome }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "esphome==${{ matrix.esphome }}"
      - name: Supply public CI placeholders
        run: cp ci/secrets.example.yaml secrets.yaml
      - name: Validate and build
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          esphome config "$PROFILE" > /dev/null
          esphome compile "$PROFILE"
      - name: Test large UI responses against the firmware JSON library
        if: matrix.esphome == '2026.8.1' && matrix.profile == 'peopleCounter32FourSensorOverdoor.yaml'
        run: |
          arduinojson_include="$(python -c 'from pathlib import Path; print(next(Path(".esphome/build").glob("*/managed_components/bblanchon__arduinojson/src")).resolve())')"
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -g -I. -I"$arduinojson_include" tests/ui_json_test.cpp -o /tmp/roode-ui-json-test
          /tmp/roode-ui-json-test
