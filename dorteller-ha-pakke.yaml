{
  "input_number": {
    "roode_test_actual_people": {
      "name": "Roode faktisk antall (test)",
      "min": 0,
      "max": 500,
      "step": 1,
      "mode": "box",
      "icon": "mdi:account-check"
    }
  },
  "template": [
    {
      "sensor": [
        {
          "name": "Roode Nede People Inside",
          "unique_id": "roode_nede_people_inside",
          "state": "{{ states('number.office_dorteller_nede_dorteller_nede_people_inside') | int(0) }}",
          "unit_of_measurement": "persons",
          "state_class": "measurement",
          "attributes": {
            "source_entity": "number.office_dorteller_nede_dorteller_nede_people_inside",
            "installation": "Dørteller Nede",
            "ip_address": "10.0.0.101",
            "confirmed_in": "{{ states('sensor.office_dorteller_nede_dorteller_nede_confirmed_in') }}",
            "confirmed_out": "{{ states('sensor.office_dorteller_nede_dorteller_nede_confirmed_out') }}",
            "counter_ready": "{{ states('binary_sensor.office_dorteller_nede_dorteller_nede_counter_ready') }}",
            "sensor_covered": "{{ states('binary_sensor.office_dorteller_nede_dorteller_nede_sensor_covered') }}",
            "system_status": "{{ states('sensor.office_dorteller_nede_dorteller_nede_system_status') }}",
            "unsure_detection_in": "{{ states('sensor.office_dorteller_nede_dorteller_nede_unsure_detection_in') }}",
            "unsure_detection_out": "{{ states('sensor.office_dorteller_nede_dorteller_nede_unsure_detection_out') }}"
          },
          "icon": "mdi:account-group",
          "availability": "{{ is_number(states('number.office_dorteller_nede_dorteller_nede_people_inside')) and states('number.office_dorteller_nede_dorteller_nede_people_inside') | float(-1) >= 0 and states('number.office_dorteller_nede_dorteller_nede_people_inside') | float(-1) == states('number.office_dorteller_nede_dorteller_nede_people_inside') | int(-2) }}"
        },
        {
          "name": "Roode Oppe People Inside",
          "unique_id": "roode_oppe_people_inside",
          "state": "{{ states('number.office_dorteller_oppe_dorteller_oppe_people_inside') | int(0) }}",
          "unit_of_measurement": "persons",
          "state_class": "measurement",
          "attributes": {
            "source_entity": "number.office_dorteller_oppe_dorteller_oppe_people_inside",
            "installation": "Dørteller Oppe",
            "ip_address": "10.0.0.100",
            "confirmed_in": "{{ states('sensor.office_dorteller_oppe_dorteller_oppe_confirmed_in') }}",
            "confirmed_out": "{{ states('sensor.office_dorteller_oppe_dorteller_oppe_confirmed_out') }}",
            "counter_ready": "{{ states('binary_sensor.office_dorteller_oppe_dorteller_oppe_counter_ready') }}",
            "sensor_covered": "{{ states('binary_sensor.office_dorteller_oppe_dorteller_oppe_sensor_covered') }}",
            "system_status": "{{ states('sensor.office_dorteller_oppe_dorteller_oppe_system_status') }}",
            "unsure_detection_in": "{{ states('sensor.office_dorteller_oppe_dorteller_oppe_unsure_detection_in') }}",
            "unsure_detection_out": "{{ states('sensor.office_dorteller_oppe_dorteller_oppe_unsure_detection_out') }}"
          },
          "icon": "mdi:account-group",
          "availability": "{{ is_number(states('number.office_dorteller_oppe_dorteller_oppe_people_inside')) and states('number.office_dorteller_oppe_dorteller_oppe_people_inside') | float(-1) >= 0 and states('number.office_dorteller_oppe_dorteller_oppe_people_inside') | float(-1) == states('number.office_dorteller_oppe_dorteller_oppe_people_inside') | int(-2) }}"
        },
        {
          "name": "Roode Combined People Inside",
          "unique_id": "roode_combined_people_inside",
          "state": "{% set side = states('sensor.roode_nede_people_inside') %}{% set top = states('sensor.roode_oppe_people_inside') %}{% if is_number(side) and is_number(top) %}{{ [side | int, top | int] | max }}{% elif is_number(side) %}{{ side | int }}{% elif is_number(top) %}{{ top | int }}{% else %}{{ none }}{% endif %}",
          "unit_of_measurement": "persons",
          "state_class": "measurement",
          "icon": "mdi:account-group",
          "attributes": {
            "fusion_rule": "maximum_valid_estimate",
            "note": "Estimate of one room, never sum the two counters."
          },
          "availability": "{{ is_number(states('sensor.roode_nede_people_inside')) or is_number(states('sensor.roode_oppe_people_inside')) }}"
        },
        {
          "name": "Roode Counter Difference",
          "unique_id": "roode_counter_difference",
          "state": "{% set side = states('sensor.roode_nede_people_inside') %}{% set top = states('sensor.roode_oppe_people_inside') %}{{ ((side | int(0)) - (top | int(0))) | abs }}",
          "unit_of_measurement": "persons",
          "state_class": "measurement",
          "icon": "mdi:delta",
          "availability": "{{ is_number(states('sensor.roode_nede_people_inside')) and is_number(states('sensor.roode_oppe_people_inside')) }}"
        },
        {
          "name": "Roode Counter Fusion Status",
          "unique_id": "roode_counter_fusion_status",
          "state": "{% set side = states('sensor.roode_nede_people_inside') %}{% set top = states('sensor.roode_oppe_people_inside') %}{% if not is_number(side) and not is_number(top) %}offline{% elif not is_number(top) %}nede_only{% elif not is_number(side) %}oppe_only{% elif side | int == top | int %}agreement{% else %}conflict{% endif %}",
          "icon": "mdi:source-branch"
        },
        {
          "name": "Roode Test Error",
          "unique_id": "roode_test_error",
          "state": "{{ states('sensor.roode_combined_people_inside') | int(0) - states('input_number.roode_test_actual_people') | int(0) }}",
          "unit_of_measurement": "persons",
          "icon": "mdi:delta",
          "availability": "{{ is_number(states('sensor.roode_combined_people_inside')) and is_number(states('input_number.roode_test_actual_people')) }}"
        }
      ]
    },
    {
      "binary_sensor": [
        {
          "name": "Roode Counters Agree",
          "unique_id": "roode_counters_agree",
          "state": "{{ states('sensor.roode_nede_people_inside') | int(0) == states('sensor.roode_oppe_people_inside') | int(0) }}",
          "icon": "mdi:check-decagram",
          "availability": "{{ is_number(states('sensor.roode_nede_people_inside')) and is_number(states('sensor.roode_oppe_people_inside')) }}"
        },
        {
          "name": "Roode Room Occupied",
          "unique_id": "roode_room_occupied",
          "state": "{{ states('sensor.roode_combined_people_inside') | int(0) > 0 }}",
          "device_class": "occupancy",
          "availability": "{{ is_number(states('sensor.roode_combined_people_inside')) }}"
        },
        {
          "name": "Roode Counter Problem",
          "unique_id": "roode_counter_problem",
          "state": "{{ states('sensor.roode_counter_fusion_status') != 'agreement' }}",
          "device_class": "problem",
          "delay_on": {
            "seconds": 30
          }
        }
      ]
    }
  ],
  "script": {
    "roode_set_both_counts": {
      "alias": "Roode sett begge tellere til faktisk antall",
      "description": "Manuell korrigering. Bruk bare når faktisk antall er kjent og døren er fri. Endrer begge ESP-tellernes persontall.",
      "mode": "single",
      "sequence": [
        {
          "variables": {
            "source_nede": "number.office_dorteller_nede_dorteller_nede_people_inside",
            "source_oppe": "number.office_dorteller_oppe_dorteller_oppe_people_inside"
          }
        },
        {
          "condition": "template",
          "value_template": "{{ source_nede != '' and source_oppe != '' and source_nede != source_oppe\nand is_number(states(source_nede)) and is_number(states(source_oppe))\nand states(source_nede) | float(-1) >= 0 and states(source_oppe) | float(-1) >= 0\nand states(source_nede) | float(-1) == states(source_nede) | int(-2)\nand states(source_oppe) | float(-1) == states(source_oppe) | int(-2)\nand is_number(states('input_number.roode_test_actual_people')) }}"
        },
        {
          "action": "number.set_value",
          "target": {
            "entity_id": [
              "number.office_dorteller_nede_dorteller_nede_people_inside",
              "number.office_dorteller_oppe_dorteller_oppe_people_inside"
            ]
          },
          "data": {
            "value": "{{ states('input_number.roode_test_actual_people') | int }}"
          }
        }
      ]
    }
  }
}
