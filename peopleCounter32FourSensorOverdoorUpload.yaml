substitutions:
  devicename: roode-four-sensor-overdoor
  friendly_name: Roode Four Sensor Overdoor

# Standalone upload profile. Publish component changes to main before using it.
# Refresh every build so fixes are not hidden by ESPHome's one-day Git cache.
external_components:
  - source:
      type: git
      url: https://github.com/Prosono/Roode2.git
      ref: main
    components: [counting_core, tof_overdoor_counter, tof_overdoor_ui]
    refresh: always

esphome:
  min_version: 2026.3.0
  name: ${devicename}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO
  # Prevent USB serial clients from leaving EN/BOOT asserted after attaching.
  deassert_rts_dtr: true

preferences:
  # Bounds counter loss after a hard power cut without forcing a blocking NVS
  # sync in the measurement loop.
  flash_write_interval: 1s

api:
  # Counting and recovery must continue through router/HA outages.
  reboot_timeout: 0s

safe_mode:
  num_attempts: 10
  reboot_timeout: 5min
  # Sensor recovery happens after the ESPHome core is alive; do not count a
  # healthy core as a failed boot just because a ToF channel is still retrying.
  boot_is_good_after: 30s

ota:
  - platform: esphome
    password: !secret roode_ota_password

wifi:
  ssid: !secret roode_wifi_ssid
  password: !secret roode_wifi_password
  fast_connect: true
  reboot_timeout: 0s
  use_address: 10.0.0.100
  manual_ip:
    static_ip: 10.0.0.100
    gateway: 10.0.0.1
    subnet: 255.255.255.0
  domain: .local
  power_save_mode: none
  ap:
    ssid: "Roode 4 Counter"
    password: !secret roode_fallback_ap_password

captive_portal:

web_server:
  # Local controls remain available; internal entities are excluded from the HA API.
  include_internal: true
  port: 80
  version: 3
  auth:
    username: !secret roode_web_username
    password: !secret roode_web_password
  sorting_groups:
    - id: web_group_overview
      name: Overview
      sorting_weight: 10
    - id: web_group_controls
      name: Controls
      sorting_weight: 20
    - id: web_group_counting
      name: Counting
      sorting_weight: 30
    - id: web_group_rows
      name: Vote Zone Activity
      sorting_weight: 40
    - id: web_group_sensors
      name: Sensor Distances
      sorting_weight: 50
    - id: web_group_settings
      name: Settings
      sorting_weight: 55
    - id: web_group_health
      name: Health
      sorting_weight: 60

tof_overdoor_ui:
  title: ${friendly_name}
  label: Front Door Counter
  counter_id: overdoor_counter

tof_overdoor_counter:
  id: overdoor_counter
  sda: 21
  scl: 22
  frequency: 400kHz
  timeout: 1500ms
  wake_delay: 120ms
  post_address_delay: 150ms
  distance_mode: long
  timing_budget: 33ms
  intermeasurement_period: 37ms
  init_retries: 3
  # Debounce already requires repeated hits; a one-sample median avoids adding
  # another full ROI cycle of latency for runners and closely-spaced people.
  sampling: 1
  update_interval: 5ms
  base_address: 0x30
  # Per-ROI drops from the calibrated empty-doorway baseline.
  trigger_delta: 280mm
  release_delta: 140mm
  baseline_tolerance: 80mm
  debounce: 25ms
  sequence_timeout: 3s
  cooldown: 80ms
  blocked_timeout: 1800ms
  standing_timeout: 2200ms
  # Two matching complete tracks; still require three usable sensors.
  min_event_sensors: 2
  min_active_duration: 25ms
  # Stable empty interval required before committing a complete passage.
  direction_window: 90ms
  # Reject boot calibration while a person/object is under a typical doorway.
  minimum_clear_distance: 1200mm
  calibration_samples: 24
  # A USB/web "Reset device" succeeds after the rail has stabilized. Reproduce
  # that once after a true power-on/brownout; ESP_RST_SW will not retrigger it.
  cold_boot_soft_reset: true
  cold_boot_soft_reset_delay: 3s
  min_valid_sensors: 3
  max_people_inside: 50
  auto_save_enabled: true
  invert_direction: false
  debug_logging: false
  debug_sample_interval: 250ms
  mode: count
  xshut_pins:
    - GPIO16
    - GPIO17
    - GPIO23
    - GPIO25

button:
  - platform: restart
    name: ${friendly_name} Restart
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: web_group_controls
      sorting_weight: 40

  - platform: template
    name: ${friendly_name} Rediscover Sensors
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: web_group_controls
      sorting_weight: 10
    on_press:
      - lambda: |-
          id(overdoor_counter).rediscover();

  - platform: template
    name: ${friendly_name} Recalibrate Floor Reference
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: web_group_controls
      sorting_weight: 20
    on_press:
      - lambda: |-
          id(overdoor_counter).recalibrate();

  - platform: template
    name: ${friendly_name} Reset Counts
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: web_group_controls
      sorting_weight: 30
    on_press:
      - lambda: |-
          id(overdoor_counter).reset_counts();

  - platform: template
    name: ${friendly_name} Reset Unsure IN
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: web_group_controls
      sorting_weight: 35
    on_press:
      - lambda: |-
          id(overdoor_counter).reset_unsure_in();

  - platform: template
    name: ${friendly_name} Reset Unsure OUT
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: web_group_controls
      sorting_weight: 36
    on_press:
      - lambda: |-
          id(overdoor_counter).reset_unsure_out();

  - platform: template
    name: ${friendly_name} Reset All Counters
    internal: true
    entity_category: config
    web_server:
      sorting_group_id: web_group_controls
      sorting_weight: 37
    on_press:
      - lambda: |-
          id(overdoor_counter).reset_all_counters();

switch:
  - platform: template
    name: ${friendly_name} Invert Direction
    internal: true
    entity_category: config
    optimistic: true
    restore_mode: DISABLED
    web_server:
      sorting_group_id: web_group_settings
      sorting_weight: 10
    lambda: |-
      return id(overdoor_counter).get_invert_direction();
    turn_on_action:
      - lambda: |-
          id(overdoor_counter).set_invert_direction(true);
          id(overdoor_counter).persist_runtime_state();
    turn_off_action:
      - lambda: |-
          id(overdoor_counter).set_invert_direction(false);
          id(overdoor_counter).persist_runtime_state();

  - platform: template
    name: ${friendly_name} Auto Save Enabled
    internal: true
    entity_category: config
    optimistic: true
    restore_mode: DISABLED
    web_server:
      sorting_group_id: web_group_settings
      sorting_weight: 20
    lambda: |-
      return id(overdoor_counter).get_auto_save_enabled();
    turn_on_action:
      - lambda: |-
          id(overdoor_counter).set_auto_save_enabled(true);
          id(overdoor_counter).persist_runtime_state();
    turn_off_action:
      - lambda: |-
          id(overdoor_counter).set_auto_save_enabled(false);
          id(overdoor_counter).persist_runtime_state();

  - platform: template
    name: ${friendly_name} Debug Logging
    internal: true
    entity_category: config
    optimistic: true
    restore_mode: DISABLED
    web_server:
      sorting_group_id: web_group_settings
      sorting_weight: 25
    lambda: |-
      return id(overdoor_counter).get_debug_logging();
    turn_on_action:
      - lambda: |-
          id(overdoor_counter).set_debug_logging(true);
          id(overdoor_counter).persist_runtime_state();
    turn_off_action:
      - lambda: |-
          id(overdoor_counter).set_debug_logging(false);
          id(overdoor_counter).persist_runtime_state();

number:
  - platform: template
    id: people_inside_number
    name: ${friendly_name} People Inside
    min_value: 0
    max_value: 500
    step: 1
    mode: box
    update_interval: 1s
    # Keep the existing number.* entity ID; publish only when its value changes.
    lambda: |-
      const float count = id(overdoor_counter).get_people_count();
      if (id(people_inside_number).has_state() && id(people_inside_number).state == count)
        return {};
      return count;
    set_action:
      - lambda: |-
          id(overdoor_counter).set_people_inside(static_cast<int>(x));
          id(overdoor_counter).persist_runtime_state();

  - platform: template
    name: ${friendly_name} Trigger Delta
    internal: true
    entity_category: config
    unit_of_measurement: mm
    mode: box
    min_value: 80
    max_value: 1200
    step: 10
    update_interval: 2s
    web_server:
      sorting_group_id: web_group_settings
      sorting_weight: 30
    lambda: |-
      return id(overdoor_counter).get_trigger_threshold_value();
    set_action:
      - lambda: |-
          id(overdoor_counter).set_trigger_delta_mm((uint16_t) x);
          id(overdoor_counter).persist_runtime_state();

  - platform: template
    name: ${friendly_name} Release Delta
    internal: true
    entity_category: config
    unit_of_measurement: mm
    mode: box
    min_value: 40
    max_value: 600
    step: 10
    update_interval: 2s
    web_server:
      sorting_group_id: web_group_settings
      sorting_weight: 40
    lambda: |-
      return id(overdoor_counter).get_clear_threshold_value();
    set_action:
      - lambda: |-
          id(overdoor_counter).set_release_delta_mm((uint16_t) x);
          id(overdoor_counter).persist_runtime_state();

  - platform: template
    name: ${friendly_name} Baseline Tolerance
