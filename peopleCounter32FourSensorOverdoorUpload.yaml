  - platform: template
    name: ${friendly_name} System Status
    update_interval: 5s
    filters: &ha_text_changes
      - lambda: |-
          static bool initialized = false;
          static std::string previous;
          if (initialized && x == previous)
            return {};
          initialized = true;
          previous = x;
          return x;
    web_server:
      sorting_group_id: web_group_overview
      sorting_weight: 45
    lambda: |-
      return {id(overdoor_counter).get_system_status_text()};

