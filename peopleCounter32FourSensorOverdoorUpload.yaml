# Minimal HA surface: occupancy, IN/OUT, uncertain counts, readiness/cover,
# system status, uptime and Wi-Fi signal. Tuning and raw data stay local.
binary_sensor:
  - platform: status
    name: ${friendly_name} Device Status
    internal: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_overview
      sorting_weight: 10

  - platform: template
    name: ${friendly_name} Counter Ready
    lambda: |-
      return id(overdoor_counter).get_ready_state() > 0.5f;
    web_server:
      sorting_group_id: web_group_overview
      sorting_weight: 20

  - platform: template
    name: ${friendly_name} Presence
    internal: true
    lambda: |-
      return id(overdoor_counter).get_presence_state() > 0.5f;
    web_server:
      sorting_group_id: web_group_overview
      sorting_weight: 30

  - platform: template
    name: ${friendly_name} OUT Group Active
    internal: true
    lambda: |-
      return id(overdoor_counter).get_row_active_state(0) > 0.5f;
    web_server:
      sorting_group_id: web_group_rows
      sorting_weight: 10

  - platform: template
    name: ${friendly_name} IN Group Active
    internal: true
    lambda: |-
      return id(overdoor_counter).get_row_active_state(1) > 0.5f;
    web_server:
      sorting_group_id: web_group_rows
      sorting_weight: 20

  - platform: template
    name: ${friendly_name} Person Standing In Door
    internal: true
    lambda: |-
      return id(overdoor_counter).get_person_standing_state() > 0.5f;
    web_server:
      sorting_group_id: web_group_overview
      sorting_weight: 35

  - platform: template
    name: ${friendly_name} Sensor Covered
    device_class: problem
    lambda: |-
      return id(overdoor_counter).get_blocked_sensor_text() != "None";
    web_server:
      sorting_group_id: web_group_health
      sorting_weight: 5

sensor:
  - platform: template
    name: ${friendly_name} Discovered Sensors
    internal: true
    unit_of_measurement: sensors
    accuracy_decimals: 0
    update_interval: 5s
    # Publish the first sample and subsequent changes only, including NaN transitions.
    # This filters telemetry only; the counter still runs at its own 5 ms interval.
    filters: &ha_numeric_changes
      - lambda: |-
          static bool initialized = false;
          static float previous = NAN;
          if (initialized && (x == previous || (std::isnan(x) && std::isnan(previous))))
            return {};
          initialized = true;
          previous = x;
          return x;
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_overview
      sorting_weight: 40
    lambda: |-
      return id(overdoor_counter).get_discovered_sensor_count();

  - platform: template
    name: ${friendly_name} Cycle Duration
    internal: true
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: 5s
    filters: *ha_numeric_changes
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_health
      sorting_weight: 10
    lambda: |-
      return id(overdoor_counter).get_cycle_duration_ms();

  - platform: template
    name: ${friendly_name} Update Skew
    internal: true
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: 5s
    filters: *ha_numeric_changes
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_health
      sorting_weight: 20
    lambda: |-
      return id(overdoor_counter).get_update_skew_ms();

  - platform: template
    name: ${friendly_name} Last Decision Latency
    internal: true
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: 5s
    filters: *ha_numeric_changes
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_health
      sorting_weight: 25
    lambda: |-
      return id(overdoor_counter).get_last_decision_latency_ms();

  - platform: template
    name: ${friendly_name} People Inside
    internal: true
    unit_of_measurement: persons
    accuracy_decimals: 0
    update_interval: 100ms
    filters: *ha_numeric_changes
    web_server:
      sorting_group_id: web_group_counting
      sorting_weight: 10
    lambda: |-
      return id(overdoor_counter).get_people_count();

  - platform: template
    name: ${friendly_name} Confirmed IN
    unit_of_measurement: persons
    accuracy_decimals: 0
    update_interval: 100ms
    filters: *ha_numeric_changes
    web_server:
      sorting_group_id: web_group_counting
      sorting_weight: 20
    lambda: |-
      return id(overdoor_counter).get_entry_count();

  - platform: template
    name: ${friendly_name} Confirmed OUT
    unit_of_measurement: persons
    accuracy_decimals: 0
    update_interval: 100ms
    filters: *ha_numeric_changes
    web_server:
      sorting_group_id: web_group_counting
      sorting_weight: 30
    lambda: |-
      return id(overdoor_counter).get_exit_count();

  - platform: template
    name: ${friendly_name} Unsure Detection IN
    unit_of_measurement: events
    accuracy_decimals: 0
    update_interval: 5s
    filters: *ha_numeric_changes
    web_server:
